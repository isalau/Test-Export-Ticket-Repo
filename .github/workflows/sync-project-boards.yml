name: Sync project boards

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Client Board status to Event Bus Board
        uses: actions/github-script@v8
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          CLIENT_BOARD_TITLE: Client Board
          EVENT_BUS_BOARD_TITLE: Event Bus Board
          CLIENT_BOARD_OWNER: ${{ vars.CLIENT_BOARD_OWNER || github.repository_owner }}
          EVENT_BUS_BOARD_OWNER: ${{ vars.EVENT_BUS_BOARD_OWNER || github.repository_owner }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const clientBoardTitle = process.env.CLIENT_BOARD_TITLE;
            const eventBusBoardTitle = process.env.EVENT_BUS_BOARD_TITLE;
            const clientBoardOwner = process.env.CLIENT_BOARD_OWNER;
            const eventBusBoardOwner = process.env.EVENT_BUS_BOARD_OWNER;

            if (!process.env.PROJECTS_TOKEN) {
              core.setFailed('The PROJECTS_TOKEN secret is required.');
              return;
            }

            async function findProject(title, owner) {
              const result = await github.graphql(`
                query($owner: String!) {
                  user(login: $owner) {
                    projectsV2(first: 100) {
                      nodes { id title number }
                    }
                  }
                  organization(login: $owner) {
                    projectsV2(first: 100) {
                      nodes { id title number }
                    }
                  }
                }
              `, { owner });

              const projects = [
                ...(result.user?.projectsV2.nodes ?? []),
                ...(result.organization?.projectsV2.nodes ?? []),
              ];
              const project = projects.find((candidate) => candidate.title === title);
              if (!project) {
                throw new Error(`Could not find project ${title} for ${owner}.`);
              }
              return project;
            }

            const clientBoard = await findProject(clientBoardTitle, clientBoardOwner);
            const eventBusBoard = await findProject(eventBusBoardTitle, eventBusBoardOwner);

            async function loadProject(projectId) {
              return github.graphql(`
                query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id name
                            options { id name }
                          }
                        }
                      }
                      items(first: 100) {
                        nodes {
                          id
                          content { ... on Issue { id } ... on PullRequest { id } }
                          fieldValues(first: 100) {
                            nodes {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                name
                                field { ... on ProjectV2SingleSelectField { name } }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { projectId });
            }

            const sourceProject = (await loadProject(clientBoard.id)).node;
            const destinationProject = (await loadProject(eventBusBoard.id)).node;
            const destinationStatusField = destinationProject.fields.nodes.find(
              (field) => field.name === 'Status'
            );
            let updatedCount = 0;

            for (const sourceItem of sourceProject.items.nodes) {
              const content = sourceItem.content;
              const sourceStatus = sourceItem.fieldValues.nodes.find(
                (value) => value.field?.name === 'Status'
              )?.name;
              if (!content || !sourceStatus) continue;

              const targetItem = destinationProject.items.nodes.find(
                (item) => item.content?.id === content.id
              );
              if (!targetItem) continue;

              const statusOption = destinationStatusField?.options.find(
                (option) => option.name === sourceStatus
              );
              if (!statusOption) {
                throw new Error(`Event Bus Board has no Status option named ${sourceStatus}.`);
              }

              const targetStatus = targetItem.fieldValues.nodes.find(
                (value) => value.field?.name === 'Status'
              )?.name;
              if (targetStatus === sourceStatus) continue;

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: eventBusBoard.id,
                itemId: targetItem.id,
                fieldId: destinationStatusField.id,
                optionId: statusOption.id,
              });
              updatedCount += 1;
            }

            core.info(`Updated ${updatedCount} item(s) on ${eventBusBoardTitle}.`);